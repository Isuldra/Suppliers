name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "latest"

jobs:
  quality:
    name: Code Quality Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: bun run format:check

      - name: Lint (ESLint)
        run: bun run lint

      - name: Type check (TypeScript)
        run: bun run typecheck

      - name: Run tests (Vitest)
        run: bun run test -- --run --passWithNoTests

      - name: Summary
        if: success()
        run: |
          echo "## Quality Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All quality gates passed successfully:" >> $GITHUB_STEP_SUMMARY
          echo "- Code formatting (Prettier)" >> $GITHUB_STEP_SUMMARY
          echo "- Linting (ESLint)" >> $GITHUB_STEP_SUMMARY
          echo "- Type checking (TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo "- Tests (Vitest)" >> $GITHUB_STEP_SUMMARY

      - name: Failure Summary
        if: failure()
        run: |
          echo "## Quality Checks Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more quality gates failed. Please fix the issues and try again." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run locally with: \`bun run quality\`" >> $GITHUB_STEP_SUMMARY
          echo "Auto-fix with: \`bun run quality:fix\`" >> $GITHUB_STEP_SUMMARY
