name: Manual Release (Tag Only)

# This workflow does NOT build or publish anything itself.
# It only creates and pushes a `v<version>` tag, which triggers release.yml —
# the single workflow responsible for building and publishing the GitHub Release.
# Use this when you want to release an explicit version without a semver bump.
# For a normal patch/minor/major bump, use the "Version Management" workflow instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g., 1.5.3, without the leading v)"
        required: true
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validate version and create tag
        run: |
          VERSION="${{ github.event.inputs.version }}"

          # Reject a leading "v" and enforce plain semver X.Y.Z
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION'. Use plain semver without a leading 'v', e.g. 1.5.3"
            exit 1
          fi

          TAG="v$VERSION"

          # Fail loudly if the tag already exists (avoid clobbering a release)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin. Nothing to do."
            exit 1
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"

          echo "Pushed $TAG. release.yml will now build and publish the GitHub Release." >> "$GITHUB_STEP_SUMMARY"
