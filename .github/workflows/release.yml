name: Release Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to release, without v (e.g. 1.5.3)'
        required: true
        type: string

env:
  BUN_VERSION: '1.3.14'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The metadata step pushes with RELEASE_PAT; a persisted GITHUB_TOKEN would override it.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $env:REQUESTED_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Use a stable X.Y.Z version without a leading v."
          }
          node scripts/validate-release-source.js $version
          if ($LASTEXITCODE -ne 0) { throw 'Release version does not match the tagged source.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and check
        run: |
          bun run quality
          bun run build
          node scripts/ensure-electron-modules.js
          bun run test-sqlite

      - name: Package Windows
        run: bun run dist:clean -- --skip-vite-build

      - name: Prepare update metadata
        run: bun run release:prepare

      - name: Publish GitHub assets
        run: bun run release:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}

      - name: Open metadata PR to production branch
        shell: pwsh
        env:
          # The repository ruleset blocks GITHUB_TOKEN from creating branches.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'RELEASE_PAT is not set. Assets are uploaded; open the metadata PR manually.' }
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure Git to push with RELEASE_PAT.' }
          $files = @('latest.yml', 'latest.json', 'index.html', '_redirects')
          $staging = Join-Path $env:RUNNER_TEMP "pulse-metadata-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          foreach ($file in $files) {
            Copy-Item -LiteralPath "docs/updates/$file" -Destination (Join-Path $staging $file)
          }

          git restore -- package.json docs/updates
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore generated files before branch switch.' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch production branch.' }
          $branch = "release/cloudflare-v$env:RELEASE_VERSION-$env:GITHUB_RUN_ID"
          git switch -c $branch origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not create metadata branch.' }

          foreach ($file in $files) {
            Copy-Item -LiteralPath (Join-Path $staging $file) -Destination "docs/updates/$file"
          }
          git add -- docs/updates/latest.yml docs/updates/latest.json docs/updates/index.html docs/updates/_redirects
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            'Update metadata already matches main.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git commit -m "chore(release): update metadata for v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit metadata.' }
          git push origin $branch
          if ($LASTEXITCODE -ne 0) { throw 'Could not push metadata branch.' }

          $body = Join-Path $staging 'pr-body.txt'
          @(
            "Update the download page and updater metadata for Pulse v$env:RELEASE_VERSION."
            ""
            "GitHub assets have been uploaded. Merging this PR publishes metadata through the Pages configuration on main."
          ) | Set-Content -LiteralPath $body -Encoding utf8
          gh pr create --base main --head $branch --title "chore(release): Pulse v$env:RELEASE_VERSION metadata" --body-file $body
          if ($LASTEXITCODE -ne 0) { throw 'Assets are uploaded, but the metadata PR must be opened manually.' }
          'GitHub assets uploaded. Merge the metadata PR and verify the Cloudflare deployment.' >> $env:GITHUB_STEP_SUMMARY
