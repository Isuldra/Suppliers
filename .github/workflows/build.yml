name: 🏗️ Build Electron App for Windows

# Trigger a new workflow run with this comment update
on:
  push:
    branches: [main]
    # NOTE: Removed tags trigger - release.yml handles tag builds to avoid duplicate builds
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["🏷️ Version Management"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "latest"
  SHARP_IGNORE_GLOBAL_LIBVIPS: "1"

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache electron-builder dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Application
        shell: pwsh
        run: |
          Write-Host "Building application..."
          bun run dist

      - name: Exclude build directories from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Attempting to add Windows Defender exclusions (safe guard)..."

          # Check if the Defender cmdlet exists
          $defenderCmd = Get-Command Add-MpPreference -ErrorAction SilentlyContinue
          if (-not $defenderCmd) {
            Write-Host "Add-MpPreference cmdlet not available. Skipping Defender exclusions."
            exit 0
          }

          # Check Defender service state
          $winDefend = Get-Service -Name WinDefend -ErrorAction SilentlyContinue
          if (-not $winDefend -or $winDefend.Status -ne 'Running') {
            Write-Host "Windows Defender service not running or not present. Skipping Defender exclusions."
            exit 0
          }

          # Add exclusions, but do not fail the job if they error
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}\dist" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "${{ github.workspace }}\node_modules" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "${{ github.workspace }}\release" -ErrorAction Stop
            Write-Host "Windows Defender exclusions added."
          } catch {
            Write-Warning "Failed to add Windows Defender exclusions: $_. Exception will be ignored and build will continue."
          }

      - name: Generate latest.yml for Portable Auto-Updates
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Write-Host "Generating latest.yml for portable auto-updates..."
          bun run scripts/generate-latest-yml.js

      - name: Generate app-update.yml for NSIS Auto-Updates
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Write-Host "Generating app-update.yml for NSIS auto-updates..."
          bun run scripts/generate-app-update-yml.js

      - name: Prepare Cloudflare metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Write-Host "Preparing Cloudflare metadata for auto-updates..."
          bun run release:prepare

      - name: Commit and push Cloudflare metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Add the metadata files
          git add docs/updates/latest.yml
          git add docs/updates/latest.json
          git add docs/updates/index.html
          git add docs/updates/_redirects

          # Check if there are any changes to commit
          if git diff-index --quiet HEAD; then
            echo "No changes in Cloudflare metadata to commit."
          else
            git commit -m "chore(release): Update Cloudflare metadata for v${GITHUB_REF#refs/tags/v}"
            git push origin main
            echo "Successfully pushed Cloudflare metadata updates"
          fi

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*Portable.exe
            release/*.zip
            release/*.exe
            release/latest.yml
            release/app-update.yml
          draft: false
          prerelease: false

      - name: List ASAR Contents on Failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "--- Attempting to list ASAR contents ---"
          $asarPath = Get-ChildItem -Path release -Recurse -Filter app.asar | Select-Object -First 1
          if ($asarPath) {
            bunx asar list $asarPath.FullName
          } else {
            Write-Host "app.asar not found."
          }
          Write-Host "--- End ASAR contents list ---"

      - name: Upload Portable Executable
        if: >
          !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: SupplyChain-Portable-Windows
          path: release/*Portable.exe
          retention-days: 3

      - name: Upload Zip Archive
        if: >
          !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: SupplyChain-Zip-Windows
          path: release/*.zip
          retention-days: 3

      - name: Upload NSIS Installer
        if: >
          !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: SupplyChain-NSIS-Windows
          path: release/*.exe
          retention-days: 3

      # Note: SLACK_WEBHOOK_URL is an optional secret. If not set, this step will be skipped.
      # The linter warning about "Context access might be invalid" is expected and can be ignored.
      - name: Send CHANGELOG to Slack
        if: startsWith(github.ref, 'refs/tags/') && success()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || '' }}
          SLACK_DISPLAY_NAME: ${{ github.actor }} (GitHub)
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ] && [ "$SLACK_WEBHOOK_URL" != "" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "📋 Sending CHANGELOG to Slack for version $VERSION..."
            bun run scripts/send-changelog-to-slack.js "$VERSION"
          else
            echo "⚠️  SLACK_WEBHOOK_URL secret not set, skipping Slack notification"
          fi
