name: 🏷️ Version Management

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type to create"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      push_changes:
        description: "Automatically push changes and tags"
        required: true
        default: true
        type: boolean
      tag_prefix:
        description: "Git tag prefix (default: v)"
        required: false
        default: "v"
        type: string

env:
  BUN_VERSION: "1.3.14"
  TAG_PREFIX: ${{ inputs.tag_prefix || 'v' }}

jobs:
  version:
    name: Create New Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js (for npm version command)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Show current version info
        run: bun run version:info

      - name: Create new version
        run: |
          if [ "${{ inputs.push_changes }}" = "true" ]; then
            bun run version:bump:${{ inputs.version_type }}:push
          else
            bun run version:bump:${{ inputs.version_type }}
          fi
        env:
          TAG_PREFIX: ${{ env.TAG_PREFIX }}

      - name: Show version info after bump
        run: bun run version:info

      - name: Push changes (if not auto-pushed)
        if: inputs.push_changes == 'false'
        run: |
          git push origin main --follow-tags

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Created version: $VERSION"

      # NOTE: This workflow only bumps the version and pushes the tag.
      # Pushing the v* tag triggers release.yml, which is the single workflow
      # responsible for building and publishing the GitHub Release. Do NOT create
      # a release here (previously used the archived actions/create-release@v1),
      # otherwise the tag would be published twice by two different mechanisms.

      - name: Summary
        run: |
          echo "## 🎉 Version Management Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version Type:** ${{ inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**New Version:** ${{ env.TAG_PREFIX }}${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag Prefix:** ${{ env.TAG_PREFIX }}" >> $GITHUB_STEP_SUMMARY
          echo "**Auto Push:** ${{ inputs.push_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The version tag has been pushed. release.yml will now build and publish the GitHub Release." >> $GITHUB_STEP_SUMMARY
